# Default config: ~/.config/bibdesk-rag/config.toml
# After editing a custom copy: bibdesk-rag --config use /path/to/config.toml
# Relative paths are relative to this file; ~ expands to the current user home.
bib = "/path/to/references.bib"
# Use a different database path for each library.
database = "~/.local/share/bibdesk-rag/index.sqlite3"

[extraction]
chunk_size = 1500
chunk_overlap = 200
max_file_bytes = 104857600
max_archive_members = 1000
max_archive_bytes = 209715200
max_compression_ratio = 100
max_chunks = 50000
