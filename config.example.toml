# Copy to your own config path; relative paths are relative to this file.
bib = "/path/to/references.bib"
database = "/path/to/user-data/bibdesk-rag/index.sqlite3"

[extraction]
chunk_size = 1500
chunk_overlap = 200
max_file_bytes = 104857600
max_archive_members = 1000
max_archive_bytes = 209715200
max_compression_ratio = 100
max_chunks = 50000
